spring.application.name=ms-pedidos

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/plazoleta_pedidos?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/plazoleta_trazabilidad

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Server
server.port=8083

# JWT
jwt.secret=claveSecreta256BitsParaJWTTokenDeAccesoDelSistemaPlazoleta

# ms-restaurantes
ms-restaurantes.url=http://localhost:8082

# ms-usuarios
ms-usuarios.url=http://localhost:8081
